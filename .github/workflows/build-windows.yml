name: Build Orderly POS Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run electron:build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Orderly-POS-Windows
          path: release/*.exe
          if-no-files-found: error
